type Query {
  _empty: String
}

type Author {
  id: ID!
  name: String!
  bio: String
  birth_date: String
  created_at: String
  updated_at: String
}

type AuthorPaginated {
  data: [Author!]!
  total: Int!
  page: Int!
  limit: Int!
}

type Query {
  authors(
    page: Int = 1
    limit: Int = 10
    name: String
  ): AuthorPaginated!
}